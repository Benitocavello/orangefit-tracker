<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orangefit Tracker - Patch v2</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #fff8f0 0%, #f0faf0 100%); padding: 12px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { text-align: center; color: #FF6F00; margin: 10px 0 14px; }
    .total { font-size: 52px; font-weight: 800; text-align: center; color: #2E7D32; margin: 6px 0 12px; }
    .progress { height: 12px; background: #eee; border-radius: 99px; overflow: hidden; margin: 6px 0 12px; }
    .progress > div { height: 100%; width: 0%; background: #2E7D32; transition: width 0.4s, background 0.3s; }
    .card { background: #fff; border-radius: 12px; padding: 12px; margin: 10px 0; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .card h3 { margin: 6px 0 8px; color: #FF6F00; font-size: 15px; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .row:last-child { border-bottom: none; }
    .muted { color: #666; font-size: 12px; }
    input[type="checkbox"] { width: 18px; height: 18px; }
    input[type="range"] { width: 100%; }
    input[type="number"] { width: 100%; padding: 8px; border: 2px solid #FFE0B2; border-radius: 6px; }
    select { width: 100%; padding: 8px; border: 2px solid #FFE0B2; border-radius: 6px; }
    .btn { width: 100%; padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; }
    .btn.primary { background: #FF6F00; color: white; }
    .btn.primary:hover { background: #E65100; }
    .btn.ghost { background: #fff; border: 1px solid #ddd; color: #333; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍊 Orangefit Voedingstracker</h1>
    <div id="total" class="total">0 kcal</div>
    <div class="muted" id="dateDisplay" style="text-align:center"></div>
    <div class="progress" aria-label="voedings progress">
      <div id="progressFill"></div>
    </div>

    <!-- Ontbijt -->
    <div class="card" id="block-ontbijt">
      <h3>☀️ Ontbijt</h3>
      <div class="row">
        <label><input type="checkbox" id="shake" onchange="update()"> Orangefit Diet Shake</label>
        <span>230 kcal</span>
      </div>
      <div class="row" style="flex-direction:column; align-items:flex-start;">
        <label class="muted" style="margin-bottom:6px;">Vloeistof</label>
        <select id="vloeistof" onchange="update()">
          <option value="0">Water</option>
          <option value="30">Magere melk 300ml</option>
        </select>
      </div>
      <!-- Greens Shake added as morning tussendoortje (niet ontbijt) -->
      <div class="row" style="flex-direction:column; align-items:flex-start;">
        <label class="muted" style="margin-bottom:6px;">Greens Shake (ochtend tussendoortje)</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="checkbox" id="greensShake" onchange="update()">
          <span>Greens Shake</span>
          <span>10 kcal</span>
        </div>
      </div>
      <!-- Kopjes koffie (ochtend) -->
      <div class="row" style="flex-direction:column; align-items:flex-start;">
        <label class="muted" style="margin-bottom:6px;">Koffie (ochtend) kopjes</label>
        <div style="display:flex; gap:8px; width:100%;">
          <input type="number" id="coffeeBlack" placeholder="kopjes zwart" min="0" value="0" oninput="update()" style="flex:1;">
          <input type="number" id="coffeeMilk" placeholder="kopjes melk" min="0" value="0" oninput="update()" style="flex:1;">
        </div>
      </div>
    </div>

    <!-- Lunch -->
    <div class="card" id="block-lunch">
      <h3>🥗 Lunch</h3>
      <div class="row">
        <label><input type="checkbox" id="lunch" onchange="update()"> Yoghurt/kwark + low-carb granola</label>
        <span>275 kcal</span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="bessen" onchange="update()"> Handje bessen</label>
        <span>30 kcal</span>
      </div>
    </div>

    <!-- Middag Snack -->
    <div class="card" id="block-snack">
      <h3>🧀 Middag Snack</h3>
      <div class="row">
        <label><input type="checkbox" id="cracotte3" onchange="updateMutual(3)"> 3 Cracotte + 3 plakjes kaas</label>
        <span>258 kcal</span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="cracotte4" onchange="updateMutual(4)"> 4 Cracotte + 4 plakjes kaas</label>
        <span>320 kcal</span>
      </div>
    </div>

    <!-- Diner -->
    <div class="card" id="block-diner">
      <h3>🍽️ Diner</h3>
      <input type="number" id="diner" placeholder="Vul diner kcal in..." oninput="update()">
      <div class="row" style="display:flex; gap:6px;">
        <button class="btn ghost" onclick="setDiner(500)">500</button>
        <button class="btn ghost" onclick="setDiner(600)">600</button>
        <button class="btn ghost" onclick="setDiner(700)">700</button>
        <button class="btn ghost" onclick="setDiner(800)">800</button>
      </div>
    </div>

    <!-- Avond Snack + Noortjes -->
    <div class="card" id="block-avond">
      <h3>🌙 Avond Snack</h3>
      <div class="row" style="flex-direction:column; align-items:flex-start;">
        <label class="muted" style="margin-bottom:6px;">Kruidenthee / snackgroenten</label>
        <input type="range" id="avondSnack" min="0" max="50" value="0" oninput="update()">
      </div>
      <div class="row" style="flex-direction:column; align-items:flex-start;">
        <label class="muted" style="margin-bottom:6px;">Nootjes (handjes)</label>
        <input type="number" id="nootjes" placeholder="Aantal handjes" min="0" value="0" oninput="update()">
        <div id="nootjesTotal" class="muted" style="text-align:right;margin-top:6px;"></div>
      </div>
    </div>

    <!-- Overige voeding & verbrande kcal -->
    <div class="card" id="block-overig">
      <h3>🍴 Overige Voeding & Verbranding</h3>
      <div class="row" style="flex-direction:column;">
        <label class="muted" style="margin-bottom:6px;">Overige voeding (kcal)</label>
        <input type="number" id="overig" placeholder="Extra kcal vandaag" min="0" value="0" oninput="update()" />
        <div id="overigeTotal" class="muted" style="text-align:right;margin-top:6px;"></div>
      </div>
      <div class="row" style="flex-direction:column; margin-top:6px;">
        <label class="muted" style="margin-bottom:6px;">Verbrand kcal (sport)</label>
        <input type="number" id="verbrand" placeholder="Verbrand kcal" min="0" value="0" oninput="update()" />
      </div>
    </div>

    <!-- Einde-dag & verzenden -->
    <div class="card" id="block-end">
      <label><input type="checkbox" id="eindeDag"> Dit is mijn laatste invoer van vandaag</label>
      <button class="btn primary" style="margin-top:8px" onclick="sendToGoogleSheet()">📤 Verzend naar Google Sheet</button>
      <div id="sendStatus" class="muted" style="text-align:center;margin-top:6px;"></div>
    </div>

    <!-- Google Sheet URL -->
    <div class="card" id="sheet-card">
      <h3>🗂️ Google Sheet URL</h3>
      <button class="btn ghost" onclick="getSheetUrl()">Krijg Sheet URL</button>
      <div id="sheetUrl" class="muted" style="margin-top:6px;"></div>
    </div>
  </div>

<script>
  // Pas de /exec URL aan waar data naartoe gaat
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1i_JXNOodNXfDWIV2ncfmOfSPKoBoe-ZyB5xGegNFjqwSSH7cjUSA4OVeUANBfhvU/exec';

  function pad(n){ return n < 10 ? '0'+n : n; }
  function getDate(){ const d=new Date(); return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear(); }
  function getDay(){ const days=['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag']; return days[new Date().getDay()]; }

  function update(){
    // bereken delta
    let total = 0;
    if (document.getElementById('shake').checked) total += 230;
    total += parseInt(document.getElementById('vloeistof').value) || 0;
    if (document.getElementById('greensShake')?.checked) total += 10;

    // koffie
    const cb = parseInt(document.getElementById('coffeeBlack').value) || 0;
    const cm = parseInt(document.getElementById('coffeeMilk').value) || 0;
    total += cb*2 + cm*35;

    // lunch & bessen
    if (document.getElementById('lunch').checked) total += 275;
    if (document.getElementById('bessen').checked) total += 30;

    // middag snack
    if (document.getElementById('cracotte3').checked) total += 258;
    if (document.getElementById('cracotte4').checked) total += 320;

    // avond
    total += parseInt(document.getElementById('avondSnack').value) || 0;
    // nootjes
    const nootjes = parseInt(document.getElementById('nootjes').value) || 0;
    total += nootjes * 180;
    if (nootjes > 0) document.getElementById('nootjesTotal').textContent = nootjes + ' handje(s) ≈ ' + (nootjes*180) + ' kcal';
    else document.getElementById('nootjesTotal').textContent = '';

    // overige
    const overig = parseInt(document.getElementById('overig').value) || 0;
    total += overig;
    if (overig > 0) document.getElementById('overigeTotal').textContent = overig + ' kcal';
    else document.getElementById('overigeTotal').textContent = '';

    // verbrande
    const verbrand = parseInt(document.getElementById('verbrand').value) || 0;
    const net = total - verbrand;

    document.getElementById('total').textContent = net + ' kcal';
    // kleur
    let color = '#2E7D32';
    if (net > 2200) color = '#D32F2F';
    else if (net > 1800) color = '#FFA726';
    document.getElementById('total').style.color = color;

    // sheet preview (placeholder)
    document.getElementById('sheetPreview')?.textContent = 'Netto voor vandaag: ' + net + ' kcal';
  }

  function updateMutual(which){
    if (which===3) document.getElementById('cracotte4').checked = false;
    if (which===4) document.getElementById('cracotte3').checked = false;
    update();
  }

  function setDiner(val){
    document.getElementById('diner').value = val;
    update();
  }

  async function sendToGoogleSheet(){
    // compute delta (net) opnieuw
    let consumed = 0;
    if (document.getElementById('shake').checked) consumed += 230;
    consumed += parseInt(document.getElementById('vloeistof').value) || 0;
    if (document.getElementById('greensShake')?.checked) consumed += 10;
    consumed += (parseInt(document.getElementById('coffeeBlack').value) || 0) * 2;
    consumed += (parseInt(document.getElementById('coffeeMilk').value) || 0) * 35;
    if (document.getElementById('lunch').checked) consumed += 275;
    if (document.getElementById('bessen').checked) consumed += 30;
    if (document.getElementById('cracotte3').checked) consumed += 258;
    if (document.getElementById('cracotte4').checked) consumed += 320;
    consumed += (parseInt(document.getElementById('diner').value) || 0);
    consumed += (parseInt(document.getElementById('avondSnack').value) || 0);
    consumed += (parseInt(document.getElementById('nootjes').value) || 0) * 180;
    consumed += (parseInt(document.getElementById('overig').value) || 0);
    const burned = parseInt(document.getElementById('verbrand').value) || 0;
    const delta = consumed - burned;

    const einde = document.getElementById('eindeDag').checked ? 'true':'false';
    const params = new URLSearchParams();
    const date = getDate();
    params.append('datum', date);
    params.append('dag', getDay());
    params.append('kcal', delta);
    params.append('einde', einde);

    try {
      await fetch(SCRIPT_URL + '?' + params.toString(), { method:'POST', mode:'no-cors' });
      document.getElementById('sendStatus').textContent = '✅ Verzonden';
    } catch(err){
      document.getElementById('sendStatus').textContent = '❌ Fout Verzenden';
    }
  }

  // Sheet URL ophalen
  async function getSheetUrl(){
    try {
      const r = await fetch(SCRIPT_URL);
      const url = await r.text();
      document.getElementById('sheetUrl').textContent = url || 'Sheet URL niet gevonden';
    } catch(err){
      document.getElementById('sheetUrl').textContent = 'Fout bij ophalen: ' + err;
    }
  }

  // Init
  update();
</script>
</body>
</html>
