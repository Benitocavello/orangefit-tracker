<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orangefit Tracker - Patch</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #fff8f0 0%, #f0faf0 100%); padding: 12px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #FF6F00; margin: 8px 0 12px; }
    .total { font-size: 52px; font-weight: 800; text-align: center; color: #2E7D32; margin: 6px 0 12px; }
    .card { background: #fff; border-radius: 10px; padding: 12px; margin: 10px 0; box-shadow: 0 2px 10px rgba(0,0,0,.08); border: 1px solid #eee; }
    .card h3 { margin: 6px 0 8px; color: #FF6F00; font-size: 14px; }
    .row { display:flex; align-items:center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #eee; }
    .row:last-child { border-bottom: none; }
    label { cursor: pointer; }
    input[type="checkbox"] { width: 18px; height: 18px; }
    input[type="number"] { width: 100%; padding: 8px; font-size: 14px; border: 2px solid #FFE0B2; border-radius: 6px; }
    input[type="range"] { width: 100%; }
    select { width: 100%; padding: 8px; font-size: 14px; }
    .btn { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #FF6F00; color: white; font-weight: 700; cursor: pointer; }
    .btn:hover { background: #E65100; }
    .muted { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍊 Mijn Voedingstracker</h1>

    <div id="total" class="total">0 kcal</div>

    <!-- Ontbijt -->
    <div class="card" id="card-shake">
      <h3>☀️ Ontbijt (07:30-08:30)</h3>
      <div class="row">
        <label><input type="checkbox" id="shake" onchange="update()"> Orangefit Diet Shake</label>
        <span>230 kcal</span>
      </div>
      <div class="row" style="flex-direction:column; align-items:flex-start;">
        <label class="muted" style="margin-bottom:4px;">Vloeistof</label>
        <select id="vloeistof" onchange="update()">
          <option value="0">Water</option>
          <option value="30">Magere melk 300ml</option>
        </select>
      </div>
      <div class="row" style="flex-direction:column; align-items:flex-start;">
        <label class="muted" style="margin-bottom:4px;">Koffie (ochtend) - kopjes</label>
        <div style="display:flex; gap:8px; width:100%;">
          <input type="number" id="coffeeBlack" placeholder="kopjes zwarte" min="0" value="0" oninput="update()" style="flex:1;" />
          <input type="number" id="coffeeMilk"  placeholder="kopjes melk" min="0" value="0" oninput="update()" style="flex:1;" />
        </div>
        <div class="muted" style="margin-top:6px;">Zwarte koffie: 2 kcal per kopje; Koffie met magere melk: 35 kcal per kopje</div>
      </div>
    </div>

    <!-- Lunch -->
    <div class="card">
      <h3>🥗 Lunch</h3>
      <div class="row">
        <label><input type="checkbox" id="lunch" onchange="update()"> Yoghurt/kwark + low-carb granola</label>
        <span>275 kcal</span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="bessen" onchange="update()"> Handje bessen</label>
        <span>30 kcal</span>
      </div>
    </div>

    <!-- Middag Snack -->
    <div class="card">
      <h3>🧀 Middag Snack</h3>
      <div class="row">
        <label><input type="checkbox" id="cracotte3" onchange="updateMutual(3)"> 3 Cracotte + 3 plakjes kaas</label>
        <span>258 kcal</span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="cracotte4" onchange="updateMutual(4)"> 4 Cracotte + 4 plakjes kaas</label>
        <span>320 kcal</span>
      </div>
    </div>

    <!-- Diner -->
    <div class="card">
      <h3>🍽️ Diner (18:00-19:00)</h3>
      <input type="number" id="diner" placeholder="Vul kcal in..." oninput="update()" />
      <div class="row" style="display:flex; gap:6px;">
        <button class="btn" onclick="setDiner(500)">500</button>
        <button class="btn" onclick="setDiner(600)">600</button>
        <button class="btn" onclick="setDiner(700)">700</button>
        <button class="btn" onclick="setDiner(800)">800</button>
      </div>
    </div>

    <!-- Avond Snack -->
    <div class="card">
      <h3>🌙 Avond Snack</h3>
      <input type="range" id="avondSnack" min="0" max="50" value="0" oninput="update()" />
      <div class="muted" style="text-align:right; margin-top:6px;">0-50 kcal</div>
    </div>

    <!-- Overige Voeding -->
    <div class="card" id="overigCard">
      <h3>🍴 Overige Voeding</h3>
      <input type="number" id="overig" placeholder="Extra kcal vandaag" min="0" value="0" oninput="update()" />
      <div id="overigeTotal" class="muted" style="text-align:right; margin-top:6px;"></div>
    </div>

    <!-- Einde-dag + verzenden -->
    <div class="card" style="background:#fff;">
      <label><input type="checkbox" id="eindeDag" /> Dit is mijn laatste invoer van vandaag</label>
      <button class="btn" onclick="sendToGoogleSheet()" id="sendBtn">📤 Verzend naar Google Sheet</button>
      <div id="sendStatus" class="muted" style="text-align:center; font-weight:700; margin-top:6px;"></div>
    </div>
  </div>

  <script>
    // Pas eventueel jouw /exec URL aan (permanent URL)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbznL2ABsaJmuFsf5kNQJRuNhq8HrriNqZQ-XeRG3vHJofGFNqShiGxHJMCwoR636fzj/exec';

    function getDate(){
      const d = new Date();
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth()+1).padStart(2,'0');
      return dd+'-'+mm+'-'+d.getFullYear();
    }
    function getDay(){ const days=['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag']; return days[new Date().getDay()]; }

    function update() {
      // bereken delta
      let total = 0;
      if (document.getElementById('shake').checked) total += 230;
      total += parseInt(document.getElementById('vloeistof').value) || 0;

      // koffie
      const cb = parseInt(document.getElementById('coffeeBlack').value) || 0;
      const cm = parseInt(document.getElementById('coffeeMilk').value) || 0;
      total += cb * 2;
      total += cm * 35;

      // lunch & bessen
      if (document.getElementById('lunch').checked) total += 275;
      if (document.getElementById('bessen').checked) total += 30;

      // middag snack opties - mutual exclusive
      if (document.getElementById('cracotte3').checked) total += 258;
      if (document.getElementById('cracotte4').checked) total += 320;

      // diner & avond
      total += parseInt(document.getElementById('diner').value) || 0;
      total += parseInt(document.getElementById('avondSnack').value) || 0;

      // overige voeding
      const overig = parseInt(document.getElementById('overig').value) || 0;
      total += overig;
      document.getElementById('overigeTotal').textContent = overig > 0 ? overig + ' kcal' : '';

      // UI
      document.getElementById('total').textContent = total + ' kcal';
    }

    // Mutual exclusivity tussen cracotte3 en cracotte4
    function updateMutual(which){
      if (which === 3) document.getElementById('cracotte4').checked = false;
      if (which === 4) document.getElementById('cracotte3').checked = false;
      update();
    }

    function setDiner(val){
      document.getElementById('diner').value = val;
      update();
    }

    async function sendToGoogleSheet(){
      const datum = getDate();
      const dag = getDay();
      // bereken delta opnieuw (om zeker te weten dat alles meegaat)
      const delta = (function(){
        let t = 0;
        if (document.getElementById('shake').checked) t += 230;
        t += (document.getElementById('vloeistof').value ? parseInt(document.getElementById('vloeistof').value) : 0);
        t += (parseInt(document.getElementById('coffeeBlack').value) || 0) * 2;
        t += (parseInt(document.getElementById('coffeeMilk').value) || 0) * 35;
        if (document.getElementById('lunch').checked) t += 275;
        if (document.getElementById('bessen').checked) t += 30;
        if (document.getElementById('cracotte3').checked) t += 258;
        if (document.getElementById('cracotte4').checked) t += 320;
        t += (parseInt(document.getElementById('diner').value) || 0);
        t += (parseInt(document.getElementById('avondSnack').value) || 0);
        t += (parseInt(document.getElementById('overig').value) || 0);
        return t;
      })();
      const einde = document.getElementById('eindeDag').checked ? 'true':'false';
      const params = new URLSearchParams();
      params.append('datum', datum);
      params.append('dag', dag);
      params.append('kcal', delta);
      params.append('einde', einde);

      try {
        await fetch(SCRIPT_URL + '?' + params.toString(), { method:'POST', mode:'no-cors' });
        document.getElementById('sendStatus').textContent = '✅ Verzonden';
      } catch(err){
        document.getElementById('sendStatus').textContent = '❌ Fout Verzenden';
      }
    }

    // Init
    update();
  </script>
</body>
</html>
